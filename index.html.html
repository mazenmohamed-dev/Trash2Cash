async function api(path, options = {}) {

function adminForm(entity, fields, title, row = {}) {
  const controls = fields.map(f => {
    const value = row[f.name] ?? f.default ?? '';
    const required = f.required === false ? '' : 'required';
    if (f.type === 'checkbox') return `<label class="field"><span>${esc(f.label)}</span><input name="${f.name}" type="checkbox" ${value ? 'checked' : ''}></label>`;
    if (f.type === 'textarea') return `<label class="field full"><span>${esc(f.label)}</span><textarea name="${f.name}" rows="3" ${required}>${esc(value)}</textarea></label>`;
    if (f.type === 'select') return `<label class="field"><span>${esc(f.label)}</span><select name="${f.name}" ${required}>${f.options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
    if (f.type === 'areas') return `<div class="field full"><span>Assigned service areas</span><div class="grid">${adminState.data.areas.map(a=>`<label><input type="checkbox" name="area_ids" value="${a.area_id}" ${(row.area_ids||row.areas?.map(x=>x.area_id)||[]).map(Number).includes(Number(a.area_id))?'checked':''}> ${esc(a.area_name)}, ${esc(a.city)}</label>`).join('')}</div></div>`;
    return `<label class="field"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type||'text'}" value="${esc(value)}" ${f.min!=null?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} ${required}></label>`;
  }).join('');
  return `<form class="panel" id="admin-entity-form" data-entity="${entity}"><span class="eyebrow">${adminState.edit ? 'Edit record' : 'New record'}</span><h2>${title}</h2><div class="form-grid">${controls}</div><div class="button-row"><button class="btn primary">${adminState.edit ? 'Save changes' : 'Create'}</button>${adminState.edit?'<button class="btn" type="button" id="cancel-edit">Cancel</button>':''}</div></form>`;
}

  app.querySelectorAll('[data-admin-delete]').forEach(b=>b.onclick=async()=>{const kind=b.dataset.adminDelete,id=b.dataset.id;const routes={plan:`/plans/${id}`,category:`/categories/${id}`,truck:`/trucks/${id}`,offer:`/admin/partner-offers/${id}`};try{await api(routes[kind],{method:'DELETE'});flash('Record removed or deactivated.');adminState.edit=null;await reload();}catch(e){flash(e.message);}});
  document.querySelector('#cancel-edit')?.addEventListener('click',()=>{adminState.edit=null;adminPage().catch(e=>flash(e.message));});
  document.querySelector('#admin-entity-form')?.addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,fd=new FormData(form),payload={};for(const [k,v] of fd.entries()){if(k==='area_ids')continue;payload[k]=v;}form.querySelectorAll('input[type=checkbox][name]:not([name=area_ids])').forEach(x=>payload[x.name]=x.checked);form.querySelectorAll('input[type=number]').forEach(x=>payload[x.name]=x.value===''?null:Number(x.value));if(form.dataset.entity==='truck')payload.area_ids=[...form.querySelectorAll('[name=area_ids]:checked')].map(x=>Number(x.value));if(form.dataset.entity==='offer'){payload.partner_id=Number(payload.partner_id);payload.points_required=Number(payload.points_required);payload.discount_value=payload.discount_value===''?null:Number(payload.discount_value);}const id=adminState.edit?.record?.[`${form.dataset.entity}_id`];const routes={plan:'/plans',category:'/categories',area:'/trucks/areas',truck:'/trucks',partner:'/admin/partners','offer':'/admin/partner-offers'};try{await api(id?`${routes[form.dataset.entity]}/${id}`:routes[form.dataset.entity],id?put(payload):post(payload));adminState.edit=null;flash('Saved successfully.');await reload();}catch(err){flash(err.message);}});
  app.querySelectorAll('[data-user-plan],[data-user-status]').forEach(sel=>sel.onchange=async()=>{const body=sel.dataset.userPlan?{plan_id:Number(sel.value)}:{status:sel.value};try{await api(`/admin/users/${sel.dataset.userPlan||sel.dataset.userStatus}`,put(body));flash('User updated.');await reload();}catch(e){flash(e.message);}});
  app.querySelectorAll('[data-booking-truck],[data-booking-status],[data-booking-eta]').forEach(sel=>sel.onchange=async()=>{const id=sel.dataset.bookingTruck||sel.dataset.bookingStatus||sel.dataset.bookingEta;let body;if(sel.dataset.bookingTruck)body={truck_id:sel.value?Number(sel.value):null};else if(sel.dataset.bookingStatus)body={status:sel.value};else body={estimated_arrival:sel.value||null};try{await api(`/admin/bookings/${id}`,put(body));flash('Booking updated.');await reload();}catch(e){flash(e.message);}});
  app.querySelectorAll('[data-redemption]').forEach(sel=>sel.onchange=async()=>{try{await api(`/admin/redemptions/${sel.dataset.redemption}`,put({status:sel.value}));flash('Redemption updated.');}catch(e){flash(e.message);}});
  document.querySelector('#settings-form')?.addEventListener('submit',async e=>{e.preventDefault();const settings=Object.fromEntries(new FormData(e.currentTarget));try{await api('/admin/settings',put({settings}));flash('Reward rules saved.');await reload();}catch(err){flash(err.message);}});
  document.querySelector('#notification-form')?.addEventListener('submit',async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.currentTarget));payload.user_id=payload.user_id?Number(payload.user_id):null;try{await api('/admin/notifications',post(payload));flash('Notification sent.');e.currentTarget.reset();}catch(err){flash(err.message);}});
}
async function paymentPage() {
  if(!user()){location.hash='#login';return;}
  const planId=location.hash.split('/')[1];const data=await api(`/plans/${encodeURIComponent(planId)}`);const p=data.plan;
  app.innerHTML=wrap(`${pageHead('Secure checkout','Activate your selected plan.', 'Complete the checkout form to update your membership.') }<div class="dash-grid"><article class="panel"><span class="eyebrow">Selected plan</span><h2>${esc(p.name)}</h2><strong class="price">${money(p.price)}</strong><p>${esc(p.benefits)}</p><div class="category-row"><span>Monthly bags</span><strong>${esc(p.monthly_bag_limit)}</strong></div><div class="category-row"><span>Max weight per bag</span><strong>${esc(p.max_weight_per_bag)} kg</strong></div><div class="category-row"><span>Points bonus</span><strong>${esc(p.bonus_percentage)}%</strong></div></article><form class="panel" id="checkout-form"><h2>Payment details</h2><p class="muted">The current project API simulates card validation and records the transaction; it is not connected to a real payment processor.</p><div id="payment-error"></div><div class="form-grid"><label class="field full"><span>Cardholder name</span><input name="cardholder_name" value="${esc(user().full_name)}" required></label><label class="field full"><span>Card number</span><input name="card_number" inputmode="numeric" minlength="12" maxlength="19" placeholder="4242 4242 4242 4242" required></label><label class="field"><span>Expiry (MM/YY)</span><input name="expiry_date" placeholder="MM/YY" pattern="\\d{2}/\\d{2}" required></label><label class="field"><span>CVV</span><input name="cvv" inputmode="numeric" minlength="3" maxlength="4" required></label></div><div class="form-actions"><button class="btn primary">Pay ${money(p.price)}</button></div></form></div>`);
  document.querySelector('#checkout-form').onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(e.currentTarget));payload.plan_id=Number(planId);payload.card_number=payload.card_number.replace(/\D/g,'');try{const result=await api('/payments/checkout',post(payload));flash(result.message||'Plan activated.');location.hash='#dashboard';}catch(err){document.querySelector('#payment-error').innerHTML=`<div class="error">${esc(err.message)}</div>`;}};
}
